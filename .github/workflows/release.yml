name: Build release wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.name }})
    strategy:
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - name: linux-aarch64
            runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
          - name: musllinux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
          - name: windows-x64
            runner: windows-latest
            target: x64
            manylinux: auto
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: auto
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64
            manylinux: auto
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/higuma
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -lh dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

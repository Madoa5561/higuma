name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: runtime
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install patched build and audit tools on supported tooling Python
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1" "filelock>=4.2.1"
          python -m pip install -e ".[dev,docs,security]"
      - name: Resolve and install runtime extras using the target Python
        run: |
          maturin build --release --locked --out target/audit-wheels
          "${{ steps.runtime.outputs.python-path }}" -m venv --without-pip target/audit-runtime
          wheel="$(find target/audit-wheels -name '*.whl' -print -quit)"
          python -m pip --python target/audit-runtime/bin/python install "${wheel}[compat,asgi,integrations,benchmark,async-db,observability]"
      - name: Install Rust audit tool
        if: matrix.python-version == '3.14'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit both target runtime and tooling without ignored advisories
        run: |
          python -m pip --python target/audit-runtime/bin/python list --format freeze --exclude higuma > runtime-audit-requirements.txt
          python -m pip_audit -r runtime-audit-requirements.txt --no-deps --disable-pip --strict --progress-spinner off
          python -m pip list --format freeze --exclude higuma > audit-requirements.txt
          python -m pip_audit -r audit-requirements.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Audit locked Rust dependencies
        if: matrix.python-version == '3.14'
        run: cargo audit --deny unsound --json

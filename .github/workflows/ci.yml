name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust test
        run: cargo test --locked --all-features

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install editable package
        run: python -m pip install -e ".[dev,compat,asgi,integrations,benchmark]"
      - name: Python test
        run: python -m pytest
      - name: Installed metadata
        run: python -m pip check

  ecosystem:
    name: SQLAlchemy and Redis communication
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev,compat,asgi,integrations]"
      - name: Verify database transactions and real Redis cleanup
        env:
          HIGUMA_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
        run: python -m pytest tests/test_integrations.py tests/test_project_example.py

  quality:
    name: Docs, lint, and package smoke
    needs: [rust, python, ecosystem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install project and documentation tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "mkdocs>=1.6,<2.0" "mkdocs-material>=9.6,<10.0"
      - name: Verify versions
        run: python tools/verify_release.py
      - name: Python lint
        run: python -m ruff check python tests examples tools bench
      - name: Python format
        run: python -m ruff format --check python tests examples tools bench
      - name: Byte-compile Python
        run: python -m compileall -q python tests examples tools bench
      - name: Frontend example JavaScript syntax
        run: |
          node --check examples/frontend/assets/app.js
          node --check examples/project/static/project.js
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build release wheel
        run: maturin build --release --locked --out dist
      - name: Smoke-test built wheel
        run: python tools/smoke_package.py --wheel-dir dist

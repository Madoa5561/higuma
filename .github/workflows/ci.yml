name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check
      - name: Rust test
        run: cargo test
      - name: Python lint
        run: python -m ruff check python tests examples
      - name: Test
        run: python -m unittest discover -s tests -v

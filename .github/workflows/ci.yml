name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust test
        run: cargo test --locked --all-features

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Python test
        run: python -m pytest
      - name: Installed metadata
        run: python -m pip check

  quality:
    name: Docs, lint, and package smoke
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install project and documentation tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "mkdocs>=1.6,<2.0" "mkdocs-material>=9.6,<10.0"
      - name: Verify versions
        run: python tools/verify_release.py
      - name: Python lint
        run: python -m ruff check python tests examples tools
      - name: Python format
        run: python -m ruff format --check python tests examples tools
      - name: Byte-compile Python
        run: python -m compileall -q python tests examples tools
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build release wheel
        run: maturin build --release --locked --out dist
      - name: Smoke-test built wheel
        run: python tools/smoke_package.py --wheel-dir dist

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Higuma · CSR example</title>
    <link rel="stylesheet" href="/app/assets/style.css">
    <script type="module" src="/app/assets/app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/app/">higuma <span>CLIENT EXAMPLE</span></a>
      <nav aria-label="メインナビゲーション">
        <a href="/app/">概要</a>
        <a href="/app/status">APIステータス</a>
        <a href="/app/about">仕組み</a>
      </nav>
    </header>
    <main>
      <p class="eyebrow">RUST CORE / PYTHON API / BROWSER UI</p>
      <h1 id="page-title" tabindex="-1">読み込み中</h1>
      <p id="description"></p>
      <section id="status-panel" hidden aria-label="API応答">
        <div class="panel-header"><h2>GET /api/status</h2><button id="refresh">再取得</button></div>
        <p id="request-status" role="status" aria-live="polite"></p>
        <pre id="api-response"></pre>
      </section>
      <aside>この画面のURLを再読み込みしても同じ画面を開けます。
        <code>/app/assets/missing.js</code> と <code>/api/missing</code> はHTMLに変換されません。</aside>
      <noscript>このCSRサンプルを利用するにはJavaScriptを有効にしてください。</noscript>
    </main>
    <footer>依存ライブラリなしの小さなCSRサンプル · データはHiguma APIから取得</footer>
  </body>
</html>

site_name: higuma
site_description: Flask-like Python web framework powered by a Rust HTTP core
site_url: https://higuma.moyashi.xyz/
repo_url: https://github.com/Madoa5561/higuma
repo_name: Madoa5561/higuma
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 higuma contributors

theme:
  name: material
  language: ja
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  palette:
    scheme: higuma-light
    primary: custom
    accent: custom
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - 日本語:
      - ホーム: index.md
      - はじめる: getting-started.md
      - 機能ガイド: features.md
      - 認証とセキュリティ: security-auth.md
      - デプロイ: deployment.md
      - Examples: examples.md
      - APIリファレンス: api.md
  - English:
      - Home: en/index.md
      - Getting started: en/getting-started.md
      - Feature guide: en/features.md
      - Auth and security: en/security-auth.md
      - Deployment: en/deployment.md
      - Examples: en/examples.md
      - API reference: en/api.md
  - Changelog: https://github.com/Madoa5561/higuma/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - ja
        - en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  alternate:
    - name: 日本語
      link: /
      lang: ja
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Madoa5561/higuma
      name: higuma on GitHub

site_name: higuma
site_description: Rust HTTP coreを備えた、Flaskライクで高速なPython Webフレームワーク
site_url: https://higuma.moyashi.xyz/
repo_url: https://github.com/Madoa5561/higuma
repo_name: Madoa5561/higuma
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 higuma contributors

theme:
  name: material
  language: ja
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  palette:
    scheme: higuma-light
    primary: custom
    accent: custom
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - ホーム: index.md
  - はじめる:
      - インストールと起動: getting-started.md
      - デプロイ: deployment.md
  - ガイド:
      - ルーティング: guides/routing.md
      - RequestとResponse: guides/requests-responses.md
      - SSRと静的ファイル: guides/templates-static.md
      - MiddlewareとSession: guides/middleware-sessions.md
  - APIリファレンス: api.md
  - コントリビュート: contributing.md
  - 変更履歴: https://github.com/Madoa5561/higuma/blob/main/CHANGELOG.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - ja
        - en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Madoa5561/higuma
      name: higuma on GitHub

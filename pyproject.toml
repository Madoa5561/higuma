[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "higuma"
version = "0.3.0"
description = "A fast, Flask-inspired Python web framework with a Rust HTTP core and SSR."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "madoa5561" }
]
keywords = ["web", "framework", "rust", "ssr", "http", "flask", "websocket", "openapi"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Typing :: Typed"
]

[project.urls]
Homepage = "https://higuma.moyashi.xyz"
Documentation = "https://higuma.moyashi.xyz"
Repository = "https://github.com/Madoa5561/higuma"
Issues = "https://github.com/Madoa5561/higuma/issues"
Changelog = "https://github.com/Madoa5561/higuma/blob/main/CHANGELOG.md"

[project.scripts]
higuma = "higuma.cli:main"

[project.optional-dependencies]
dev = [
  "maturin>=1.6,<2.0",
  "pytest>=8",
  "ruff>=0.6"
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.6,<10.0"
]

[tool.maturin]
module-name = "higuma._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

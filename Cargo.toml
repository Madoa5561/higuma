[package]
name = "higuma"
version = "0.1.0"
edition = "2021"
description = "Flask-like Python web framework powered by a Rust core."
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
axum = "0.7"
minijinja = { version = "2.0", features = ["loader"] }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal"] }
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
